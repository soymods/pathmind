name: Build

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tier:
        description: 'Which target tier to build: fast, full, or auto'
        required: false
        default: auto
        type: string
      ref:
        description: >-
          Commit, branch or tag to build. Leave empty to build the ref that
          triggered the run.
        required: false
        default: ''
        type: string
    outputs:
      tier:
        description: 'The tier that was actually built'
        value: ${{ jobs.discover-targets.outputs.tier }}
      matrix:
        description: 'The manifest-derived target matrix that was built, for downstream publish fan-out'
        value: ${{ jobs.discover-targets.outputs.matrix }}

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      tier: ${{ steps.targets.outputs.tier }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Discover supported Minecraft targets
        id: targets
        shell: bash
        env:
          REQUESTED_TIER: ${{ inputs.tier || 'auto' }}
        run: |
          set -euo pipefail
          MANIFEST=gradle/minecraft-versions.properties
          FULL_VERSIONS="$(sed -n 's/^supported_versions=//p' "$MANIFEST")"
          FAST_VERSIONS="$(sed -n 's/^fast_verification_versions=//p' "$MANIFEST")"

          case "${REQUESTED_TIER}" in
            full) TIER=full ;;
            fast) TIER=fast ;;
            auto)
              if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                TIER=full
              else
                TIER=fast
              fi
              ;;
            *)
              echo "Unknown tier '${REQUESTED_TIER}'; expected fast, full, or auto."
              exit 1
              ;;
          esac

          if [ "$TIER" = "full" ]; then
            VERSIONS="$FULL_VERSIONS"
          else
            VERSIONS="$FAST_VERSIONS"
          fi

          TARGETS="$(printf '%s\n' "$VERSIONS" | tr ',' '\n' | while read -r version; do
            java_version="$(awk -F= -v key="version.${version}.java_version" '$1 == key { print $2 }' "$MANIFEST")"
            generation="$(awk -F= -v key="version.${version}.packaging_generation" '$1 == key { print $2 }' "$MANIFEST")"
            jq -cn \
              --arg minecraft_version "$version" \
              --arg java_version "$java_version" \
              --arg packaging_generation "$generation" \
              '{minecraft_version: $minecraft_version, java_version: $java_version, packaging_generation: $packaging_generation}'
          done | jq -sc '{include: .}')"

          echo "matrix=${TARGETS}" >> "$GITHUB_OUTPUT"
          echo "tier=${TIER}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            gradle/wrapper/gradle-wrapper.properties
            gradle/build-generation-cache/pre26-remapped.marker

      - name: Download Baritone API dependency
        run: |
          mkdir -p libs
          curl -L -o libs/baritone-api-fabric-1.15.0.jar \
            https://github.com/cabaletta/baritone/releases/download/v1.15.0/baritone-api-fabric-1.15.0.jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify compatibility manifest
        run: ./gradlew verifyCompatibilityManifest verifyCompatibilityStructure verifyBuildGenerationRouting -Pmc_version=1.21.11

      - name: Verify unknown targets fail during configuration
        shell: bash
        run: |
          if ./gradlew help -Pmc_version=pathmind-invalid > unknown-target.log 2>&1; then
            echo "Unknown target unexpectedly configured successfully."
            exit 1
          fi
          grep -F "No version spec configured for Minecraft pathmind-invalid" unknown-target.log

      - name: Unit tests
        run: ./gradlew :common:test -Pmc_version=1.21.11

  build:
    needs:
      - discover-targets
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-targets.outputs.matrix) }}

    name: Build ${{ matrix.minecraft_version }} (${{ needs.discover-targets.outputs.tier }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            gradle/wrapper/gradle-wrapper.properties
            gradle/build-generation-cache/${{ matrix.packaging_generation }}.marker

      - name: Download Baritone API dependency
        run: |
          mkdir -p libs
          curl -L -o libs/baritone-api-fabric-1.15.0.jar \
            https://github.com/cabaletta/baritone/releases/download/v1.15.0/baritone-api-fabric-1.15.0.jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mod jars for Minecraft ${{ matrix.minecraft_version }}
        run: ./gradlew buildSelectedTarget verifySelectedCompatibilityArtifacts -Pmc_version=${{ matrix.minecraft_version }}

      - name: Stage release jars
        shell: bash
        run: |
          mkdir -p staging
          for output_dir in fabric/build/libs neoforge/build/libs mc26/fabric/build/libs mc26/neoforge/build/libs; do
            if [ -d "$output_dir" ]; then
              find "$output_dir" -maxdepth 1 -type f -name '*.jar'
            fi
          done | grep -Ev '(-sources|-dev|-shadow|-all|-javadoc)\.jar$' | xargs -I{} cp {} staging/

          echo "Staged jars for Minecraft ${{ matrix.minecraft_version }}:"
          ls staging/
          if [ -z "$(ls -A staging/)" ]; then
            echo "No suitable jars found."
            find fabric/build/libs neoforge/build/libs mc26/fabric/build/libs mc26/neoforge/build/libs -maxdepth 1 -type f 2>/dev/null | sort || true
            exit 1
          fi

          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          LOADERS="$(awk -F= -v key="version.${{ matrix.minecraft_version }}.release_loaders" '$1 == key { print $2 }' gradle/minecraft-versions.properties)"
          IFS=',' read -ra EXPECTED_LOADERS <<< "$LOADERS"
          for loader in "${EXPECTED_LOADERS[@]}"; do
            expected="staging/pathmind-${loader}-${MOD_VERSION}+mc${{ matrix.minecraft_version }}.jar"
            if [ ! -f "$expected" ]; then
              echo "Missing expected release jar: $expected"
              exit 1
            fi
          done
          STAGED_COUNT="$(find staging -maxdepth 1 -type f -name '*.jar' | wc -l | tr -d ' ')"
          if [ "$STAGED_COUNT" -ne "${#EXPECTED_LOADERS[@]}" ]; then
            echo "Expected ${#EXPECTED_LOADERS[@]} release jars but staged $STAGED_COUNT."
            exit 1
          fi

      - name: Upload mod jars
        uses: actions/upload-artifact@v7
        with:
          name: pathmind-mc${{ matrix.minecraft_version }}
          path: staging/
          if-no-files-found: error
          retention-days: 90
