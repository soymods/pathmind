name: Dependency Submission

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    name: Submit ${{ matrix.generation }} dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - generation: pre26-remapped
            java_version: '21'
            gradle_args: -Pmc_version=1.21.11
          - generation: mc26-unobfuscated
            java_version: '25'
            gradle_args: -p mc26 -Pmc_version=26.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}

      - name: Download Baritone API dependency
        run: |
          mkdir -p libs
          curl -L -o libs/baritone-api-fabric-1.15.0.jar \
            https://github.com/cabaletta/baritone/releases/download/v1.15.0/baritone-api-fabric-1.15.0.jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        env:
          DEPENDENCY_GRAPH_JOB_CORRELATOR: ${{ github.workflow }}-submit-${{ matrix.generation }}
        with:
          additional-arguments: ${{ matrix.gradle_args }}
